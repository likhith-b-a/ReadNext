[theme.light]
primaryColor = "#7c3aed"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
borderColor = "#e2e8f0"
font = "'Open Sans':https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
headingFont = "Merriweather:https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap"
baseRadius = "medium"
showWidgetBorder = true

[theme.dark]
primaryColor = "#8b5cf6"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
borderColor = "#334155"
font = "'Open Sans':https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap"
headingFont = "Merriweather:https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap"
baseRadius = "medium"
showWidgetBorder = true
